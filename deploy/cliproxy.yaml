# CLIProxyAPI v8.0.27 config for the gateway container.
# Holds no secrets: entrypoint.py substitutes the internal key from the environment.
config-version: 8

server:
  # Loopback only. Nothing outside the container can reach CLIProxyAPI.
  host: "127.0.0.1"
  port: 8317
  # Bounds a request body after CLIProxyAPI decompresses it (it accepts zstd). The gateway
  # caps bodies at 8 MiB as sent, so without this a small compressed body could expand
  # without limit inside the container. 0 would mean no limit.
  max-request-body-bytes: 33554432

management:
  allow-remote: false
  # Filled in from CGW_CLIPROXY_MANAGEMENT_KEY, which only exists once a machine is made an
  # admin. Empty disables the Management API entirely (404). CLIProxyAPI replaces the key
  # with its bcrypt hash when it loads this file. Only the remote bridge, on container
  # loopback, presents it, and only for the sign-in routes in policy.py.
  secret-key: "__CGW_CLIPROXY_MANAGEMENT_KEY__"
  disable-control-panel: true

access:
  api-keys:
    - "__CGW_CLIPROXY_KEY__"

routing:
  retry:
    request-retry: 0
    max-retry-interval: 0

oauth:
  auth-dir: "/data/cliproxy/auth"

observability:
  logs:
    debug: false
    logging-to-file: false
    request-log: false
  usage:
    usage-statistics-enabled: false

plugins:
  enabled: false
