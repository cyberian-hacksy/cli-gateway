# The gateway on any Docker host: the gateway container behind Caddy, which obtains and
# renews the TLS certificate for CGW_DOMAIN by itself.
#
#   cd deploy/docker
#   echo "CGW_DOMAIN=gateway.example.com" > .env      # the hostname that points at this host
#   docker compose up -d --build
#
# The gateway's secrets are in gateway.env next to this file (or CGW_ENV_FILE), written by
# python -m cgw bootstrap --env-file and add-client --env-file. It is owner-only and never
# committed or copied into the image.
name: cli-gateway

services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    env_file: ${CGW_ENV_FILE:-gateway.env}
    environment:
      PORT: "8080"
    volumes:
      - gateway-data:/data          # CLIProxyAPI's subscription logins
    restart: unless-stopped

  caddy:
    # Caddy 2.11.7, multi-arch index digest.
    image: caddy@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    depends_on: [gateway]
    ports:
      - "${CGW_HTTP_PORT:-80}:80"
      - "${CGW_HTTPS_PORT:-443}:443"
    environment:
      CGW_DOMAIN: ${CGW_DOMAIN:?set CGW_DOMAIN to the gateway's hostname, for example in deploy/docker/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data            # certificates
      - caddy-config:/config
    restart: unless-stopped

volumes:
  gateway-data:
  caddy-data:
  caddy-config:
